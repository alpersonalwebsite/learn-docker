# No `version:` key. It was required by Compose V1 and is now obsolete: Compose V2 ignores it and
# warns, "the attribute `version` is obsolete, it will be ignored, please remove it to avoid
# potential confusion". Verified by running `docker compose config` on a file that had it.
#
# The filename is compose.yaml, which is the name Compose V2 prefers. docker-compose.yml still
# works.

services:
  frontend:
    build: ./frontend
    ports:
      # HOST:CONTAINER. Only the frontend needs publishing for this example to be usable.
      - 3000:3000
    environment:
      # A service name, not localhost: inside a container localhost is that container.
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      # `database` is the service name below. The earlier version of these notes wrote
      # `depends_on: db` while naming the service `database`, which is not a warning but a hard
      # failure: `service "backend" depends on undefined service "db": invalid compose project`.
      DB_URL: mongodb://database/my-app
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  database:
    # Pinned, and 8.2 rather than 8.0 for a measured reason worth knowing: mongo:8.0 refuses to
    # start on a Linux kernel 6.19 or newer, exiting 1 with "MongoDB cannot start: Linux kernel
    # versions 6.19 and newer has a known incompatibility with this version of MongoDB"
    # (SERVER-121912). The Docker VM here runs 7.0.14, so 8.0 fails while 8.2 starts. Pinning
    # protects you from surprise upgrades; it does not protect you from the host moving underneath
    # the pin, which is why a pin needs an owner rather than being set once.
    #
    # And a tag is not immutable either: mongo:8.2 is rebuilt when its base changes, so this
    # resolves to new content over time. For an actual lock, add the digest, which was
    # sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3 when this was
    # written:  image: mongo:8.2@sha256:...
    # Tags are used here for readability; see docker-hello-world/Dockerfile for the trade-off.
    image: mongo:8.2
    # Not published. The backend reaches it over the project network by service name, and
    # publishing 27017 to the host would expose an unauthenticated MongoDB on your machine.
    # The earlier example published it.
    volumes:
      - my-app:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  my-app:
